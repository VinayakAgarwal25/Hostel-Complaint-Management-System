spring.application.name=hostel-complaint-system
server.port=8080

# Profile selection:
# Use 'dev' for zero-setup embedded database (H2 running in MySQL mode)
# Use 'mysql' when your local MySQL server is running on localhost:3306
spring.profiles.active=dev

# Jackson JSON formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
