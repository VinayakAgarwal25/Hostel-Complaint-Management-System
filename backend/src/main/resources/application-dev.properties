# ====================================================================
# DEV PROFILE: Embedded In-Memory Database (MySQL Mode)
# Zero installation needed - runs anywhere!
# ====================================================================
spring.datasource.url=jdbc:h2:mem:hostel_cms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize schema and seed data on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
